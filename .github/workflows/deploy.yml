name: Deploy FastAPI + ReactJSwith Docker to EC2

# Pipeline này sẽ chạy mỗi khi bạn push code lên nhánh 'main'
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Execute SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Script này sẽ chạy trực tiếp trên máy chủ EC2 của bạn
          script: |
            set -e  # <-- THÊM DÒNG NÀY: Bắt buộc dừng lại nếu có lỗi

            # 1. go to the project directory on the server
            cd ~/house-price-project
            
            # 2. pull latest code from GitHub
            git pull origin main
            
            # 3. Write the .env file on the server using the secret
            echo "EC2_HOST=${{ secrets.EC2_HOST }}" > .env
            
            # 4. Rebuild and restart the Docker containers using docker compose
            # Use docker compose (with 'space' isntead of 'hypen')
            docker compose up -d --build
            
            # 5. Clean unused Docker images and containers to free up space
            docker image prune -f
